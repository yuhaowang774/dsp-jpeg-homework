<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>JPEG 编解码流程实验台</title>
<style>
  :root{
    --bg:#e9eef6; --panel:#fff; --line:#d5dfeb; --text:#152033; --muted:#64748b;
    --blue:#1d4ed8; --blue-soft:#e8efff; --teal:#0f766e; --orange:#c2410c;
    --red:#dc2626; --green:#15803d;
    --ease-standard:cubic-bezier(.22,.61,.36,1);
    --ease-emphasis:cubic-bezier(.34,1.2,.64,1);
    --dur-fast:160ms; --dur-base:260ms; --dur-slow:380ms;
  }
  *{box-sizing:border-box}
  button,select,input[type=range]{transition:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),transform var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
  button:active{transform:scale(.98)}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  .app{position:relative;width:100%;height:100vh;margin:0;padding:0;overflow:hidden}
  .controls{display:flex;flex-direction:column;gap:14px}
  .grp{display:flex;flex-direction:column;gap:5px}
  .grp>label,.grp>.lbl{font-size:11.5px;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow-x:auto;background:#fff;max-width:100%}
  .seg button{border:0;background:#fff;padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--text);white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--blue);color:#fff}
  .qbox{display:flex;align-items:center;gap:8px;min-width:240px}
  input[type=range]{accent-color:var(--blue)}
  .qbox input{flex:1}
  .qbox b{min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .upload{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}
  .upload:hover{border-color:#9fb3cc}
  .stepper{position:fixed;left:12px;right:12px;bottom:10px;z-index:28;display:flex;gap:6px;overflow-x:auto;padding:6px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;scrollbar-width:thin;backdrop-filter:blur(8px)}
  .stepper button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--muted)}
  .stepper button .n{font-family:Consolas,monospace;font-weight:700;margin-right:4px;color:#94a3b8}
  .stepper button.on{background:var(--blue-soft);border-color:#9db8f5;color:var(--blue)}
  .stepper button.on .n{color:var(--blue)}
  .main{position:absolute;top:8px;bottom:62px;left:0;right:0;display:grid;grid-template-columns:minmax(270px,25%) minmax(0,1fr);gap:10px;padding:8px 12px 0}
  .left{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:0;overflow:auto}
  .step-kicker{font:600 11px/1 Consolas,monospace;color:var(--blue);letter-spacing:.6px}
  .left h2{font-size:19px;margin:6px 0 8px}
  .lead{color:#334155;margin:0 0 12px}
  .sec{border-top:1px dashed #e2e8f0;padding-top:10px;margin-top:10px}
  .sec h3{font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600;letter-spacing:.3px}
  .sec p{margin:0;color:#334155}
  .formula{background:#f6f8fc;border:1px solid #e3eaf4;border-radius:9px;padding:9px 11px;font:12px/1.65 Consolas,"Cascadia Mono",monospace;color:#1e293b;overflow:auto;white-space:pre;margin:8px 0 0}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .kv-grid div{background:#f6f8fc;border:1px solid #e3eaf4;border-radius:8px;padding:6px 8px}
  .kv-grid span{display:block;font-size:11px;color:var(--muted)}
  .kv-grid b{font-size:13.5px;font-variant-numeric:tabular-nums}
  ul.tips{margin:4px 0 0;padding-left:18px;color:#334155}
  ul.tips li{margin:3px 0}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12.5px}
  .tools button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .right{min-width:0;min-height:0;display:flex}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:0;height:100%;overflow:auto;flex:1}
  .stage.enter{animation:stageIn var(--dur-slow) var(--ease-standard)}
  @keyframes stageIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
  .stage-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;margin-top:8px}
  .stage-btn:hover{border-color:#9fb3cc}
  table.data tr.active{background:#fff1d6}
  table.data tr.done{color:#94a3b8}
  .stage-flex{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .stage-col{flex:1;min-width:0}
  .source-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start;width:100%}
  .source-figure{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center}
  .source-figure canvas{margin:0 auto;cursor:crosshair}
  .source-figure figcaption{text-align:center}
  .block-preview{width:100%;min-width:0;background:#f8fafc;border:1px solid #e3eaf4;border-radius:12px;padding:12px}
  .block-preview-head{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .block-preview-head b{color:var(--text);font-variant-numeric:tabular-nums}
  .block-preview canvas{max-width:100%;margin:0 auto}
  .block-preview .note{margin:8px 0 0;font-size:11.5px;line-height:1.5}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .color-grid figure{display:flex;flex-direction:column;align-items:center}
  .color-grid canvas{margin:0 auto}
  .color-grid figcaption{text-align:center}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  figure{margin:0}
  figcaption,.cap{font-size:12px;color:var(--muted);margin:5px 0 0}
  canvas{display:block;width:100%;border-radius:9px;background:#f8fafc;border:1px solid #edf1f7}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .stats div{background:#f6f8fc;border:1px solid #e3eaf4;border-radius:9px;padding:7px 9px}
  .stats span{display:block;font-size:11px;color:var(--muted)}
  .stats b{font-size:14px;font-variant-numeric:tabular-nums}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{background:#f6f8fc;border:1px solid #e3eaf4;border-radius:10px;padding:10px 12px}
  .card span{display:block;font-size:11.5px;color:var(--muted)}
  .card b{font-size:20px;font-variant-numeric:tabular-nums}
  .card small{display:block;color:var(--muted);font-size:11px}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:5px 6px;white-space:nowrap}
  table.data td{padding:5px 6px;border-bottom:1px solid #eef2f7;font-variant-numeric:tabular-nums}
  table.data code{font-family:Consolas,monospace;color:#1e3a8a}
  .scroll{max-height:330px;overflow:auto;border:1px solid #e6edf6;border-radius:10px}
  .bits{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;line-height:1.75;word-break:break-all;background:#f7f9fc;border:1px solid #e3eaf4;border-radius:9px;padding:8px;max-height:150px;overflow:auto}
  .bits .one{color:var(--blue);font-weight:700}
  .bits .zero{color:#94a3b8}
  .bits .used{background:#fff1d6}
  .bits .cursor{color:#c2410c;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{background:#eef3fb;border:1px solid #dbe6f5;border-radius:999px;padding:3px 9px;font-size:11.5px;color:#334155}
  .note{font-size:12px;color:var(--muted)}
  .hvs-block{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#fbfcfe}
  .hvs-head{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
  .hvs-head span{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:8px}
  .hvs-block figcaption{text-align:center;line-height:1.5}
  .ok{color:var(--green);font-weight:600}
  .warn{color:var(--orange);font-weight:600}
  .rle-dc{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
  .rle-dc .card{flex:1;min-width:120px}
  .error{color:var(--red);font-weight:600}
  .settings-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .settings-btn:hover{border-color:#9fb3cc}
  .settings-backdrop{position:fixed;inset:0;z-index:59;background:rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-standard)}
  .settings-backdrop.open{opacity:1;pointer-events:auto}
  .settings-panel{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(360px,92vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(15,23,42,.12);transform:translateX(105%);transition:transform var(--dur-base) var(--ease-emphasis);overflow:auto;padding:16px}
  .settings-panel.open{transform:none}
  .settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .settings-head b{font-size:16px}
  .settings-close{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
  .settings-body .grp{margin-bottom:16px}
  @media (max-width:1100px){
    .main{grid-template-columns:1fr;top:8px;bottom:62px}
    .grid-4{grid-template-columns:1fr 1fr}
  }
  @media (max-width:700px){
    .grid-2,.grid-3,.grid-4,.cards{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}
    .source-layout{grid-template-columns:1fr}
    .main{top:6px;bottom:58px;padding:6px 8px 0}
    .stepper{bottom:8px}
    .left h2{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div class="app" id="appRoot">
  <div class="settings-backdrop" id="settingsBackdrop"></div>
  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-head">
      <b>演示设置</b>
      <button class="settings-close" id="settingsCloseBtn" aria-label="关闭设置">×</button>
    </div>
    <div class="controls settings-body">
      <div class="grp">
        <span class="lbl">示例图像</span>
        <div class="seg" id="sampleButtons"></div>
      </div>
      <div class="grp">
        <span class="lbl">本地图片</span>
        <label class="upload">上传图片<input id="fileInput" type="file" accept="image/*" hidden></label>
      </div>
      <div class="grp">
        <span class="lbl">质量因子 QF</span>
        <div class="qbox"><input id="qSlider" type="range" min="1" max="100" step="1" value="50"><b id="qValue">50</b></div>
      </div>
      <div class="grp">
        <span class="lbl">色度采样</span>
        <div class="seg" id="subButtons">
          <button data-sub="444">4:4:4</button>
          <button data-sub="422">4:2:2</button>
          <button data-sub="420" class="on">4:2:0</button>
        </div>
      </div>
      <div class="grp">
        <span class="lbl">分析分量</span>
        <div class="seg" id="compButtons">
          <button data-comp="Y" class="on">Y</button>
          <button data-comp="Cb">Cb</button>
          <button data-comp="Cr">Cr</button>
        </div>
      </div>
    </div>
  </aside>

  <nav class="stepper" id="stepper"></nav>

  <div class="main">
    <aside class="left">
      <div class="step-kicker" id="stepKicker"></div>
      <h2 id="stepTitle"></h2>
      <p class="lead" id="stepLead"></p>
      <div class="sec"><h3>原理</h3><div id="stepPrinciple"></div></div>
      <pre class="formula" id="stepFormula"></pre>
      <div class="sec"><h3>当前参数</h3><div class="kv-grid" id="stepParams"></div></div>
      <div class="sec"><h3>观察要点</h3><ul class="tips" id="stepTips"></ul></div>
      <div class="tools" id="stepTools"></div>
    </aside>
    <section class="right">
      <div class="stage" id="stage"></div>
    </section>
  </div>

</div>

<script src="photos.js"></script>
<script src="demo_data.js"></script>
<script src="jpeg_codec.js"></script>
<script>
(function () {
  'use strict';

  const DATA = window.DEMO_DATA;
  const Codec = window.JpegCodec;
  const DEMO_WIDTH = 1024;
  const DEMO_HEIGHT = 1024;
  const SOURCE_CANVAS_WIDTH = 1024;
  const SOURCE_CANVAS_HEIGHT = 1024;
  const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const SMALL_SCREEN = (window.innerWidth || 1200) < 700;
  const LOW_POWER = SMALL_SCREEN || !!(typeof navigator !== 'undefined' && navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);

  const ANIM = {
    reduced: REDUCED_MOTION,
    scale: REDUCED_MOTION ? 0.12 : (LOW_POWER ? 1.25 : 1),
    FLOWS: {
      stepEnter: { trigger: 'setStep / rebuild / 切换节点', duration: 380, easing: 'easeStandard', transition: 'opacity + translateY + scale' },
      settings: { trigger: '设置按钮 / 遮罩点击', duration: 220, debounce: 140, easing: 'easeStandard', transition: 'transform + opacity' },
      basis: { trigger: '步骤05 基函数按钮', duration: 2800, easing: 'easeInOutCubic', transition: 'canvas 基函数累加' },
      twopass: { trigger: '步骤05 行列分解按钮', duration: 2400, easing: 'easeInOutCubic', transition: '先逐行后逐列 canvas 重绘' },
      quant: { trigger: '步骤06 量化按钮', duration: 2300, easing: 'steps', transition: '量化系数逐格替换' },
      zigzag: { trigger: '步骤07 Zigzag 按钮', duration: 2560, easing: 'steps', transition: '扫描游标 + 序列条带' },
      rle: { trigger: '步骤08 游程按钮', duration: 3200, easing: 'steps', transition: '符号表行高亮 + 条带游标' },
      bitwrite: { trigger: '步骤09 位流写入按钮', duration: 1400, easing: 'steps', transition: '位串增长 + 字节分组' },
      assembly: { trigger: '步骤10 拼接按钮', duration: 3600, easing: 'steps', transition: 'MCU 格点顺序点亮' },
      decode: { trigger: '步骤11 熵解码按钮', duration: 3400, easing: 'steps', transition: '符号表行高亮 + 位游标' },
      idct: { trigger: '步骤13 IDCT 按钮', duration: 1280, easing: 'easeOutCubic', transition: '基函数累加 + 误差图更新' },
      tour: { trigger: '步骤01 扫描块按钮', duration: 7000, easing: 'easeInOutSine', transition: '仅重绘源图高亮层' }
    },
    ease: {
      linear: function (t) { return t; },
      easeStandard: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
      easeInOutCubic: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
      easeOutCubic: function (t) { return 1 - Math.pow(1 - t, 3); },
      easeInOutSine: function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; },
      steps: function (t) { return t; }
    },
    duration: function (name) {
      const flow = this.FLOWS[name];
      return Math.max(80, Math.round((flow ? flow.duration : 1000) * this.scale));
    },
    interval: function (name, totalTicks) {
      return Math.max(SMALL_SCREEN ? 20 : 12, Math.round(this.duration(name) / Math.max(1, totalTicks)));
    },
    progress: function (name, tick, totalTicks) {
      const flow = this.FLOWS[name];
      const raw = clamp(tick / Math.max(1, totalTicks), 0, 1);
      const eased = (this.ease[(flow && flow.easing) || 'linear'] || this.ease.linear)(raw);
      return flow && flow.easing === 'steps' ? Math.floor(eased * totalTicks) : eased;
    }
  };

  const LABELS = {
    peppers_gray: '辣椒（灰度）',
    synthetic_gradient: '渐变（合成）',
    synthetic_texture: '纹理（合成）',
    synthetic_text: '文字（合成）'
  };

  const stage = document.getElementById('stage');
  const qSlider = document.getElementById('qSlider');
  const qValue = document.getElementById('qValue');
  const fileInput = document.getElementById('fileInput');

  const rebuildCache = new Map();
  let imageSerial = 0;

  const state = {
    imageId: 0,
    imageName: '风景示例',
    rgb: null,
    width: DEMO_WIDTH,
    height: DEMO_HEIGHT,
    Q: 50,
    subsampling: '420',
    component: 'Y',
    blockX: 16,
    blockY: 16,
    hoverBlock: null,
    step: 14,
    flowIndex: 0,
    encoded: null,
    decoded: null,
    psnr: 0,
    selectedCoeff: -1,
    zigStep: 64,
    basis: null,
    quantStep: 64,
    rleStep: 0,
    bitWriteStep: 0,
    decodeStep: 0,
    idctStep: 64,
    dctView: 'coeff',
    dctRowStep: 8,
    dctColStep: 8,
    assemblyStep: 0,
    quantTimer: null,
    rleTimer: null,
    bitTimer: null,
    decodeTimer: null,
    idctTimer: null,
    tourTimer: null,
    dctPassTimer: null,
    assemblyTimer: null,
    rebuildTimer: null
  };

  const samples = [];
  let FLOW_ENTRIES = [];

  /* ------------------------------------------------------------------ */
  /* 通用工具                                                            */
  /* ------------------------------------------------------------------ */

  function clamp(value, minimum, maximum) {
    return Math.max(minimum, Math.min(maximum, value));
  }

  function escapeHTML(text) {
    return String(text).replace(/[&<>"]/g, function (character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[character];
    });
  }

  function base64ToBytes(text) {
    const binary = atob(text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function formatValue(value) {
    const absolute = Math.abs(value);
    if (absolute >= 1000) return (value / 1000).toFixed(1) + 'k';
    if (absolute >= 10) return String(Math.round(value));
    return value.toFixed(1);
  }

  function setupCanvas(id, width, height) {
    const canvas = document.getElementById(id);
    if (!canvas) return null;
    const dpr = Math.min(SMALL_SCREEN ? 1.5 : 2, window.devicePixelRatio || 1);
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    canvas.style.maxWidth = width + 'px';
    canvas.style.aspectRatio = width + ' / ' + height;
    const context = canvas.getContext('2d');
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { canvas: canvas, ctx: context, w: width, h: height };
  }

  function drawRGBInto(target, rgb, width, height) {
    const offscreen = document.createElement('canvas');
    offscreen.width = width;
    offscreen.height = height;
    const context = offscreen.getContext('2d');
    const imageData = context.createImageData(width, height);
    imageData.data.set(rgb);
    context.putImageData(imageData, 0, 0);
    target.ctx.imageSmoothingEnabled = false;
    target.ctx.drawImage(offscreen, 0, 0, target.w, target.h);
  }

  function drawRGBRegionInto(target, rgb, width, height, regionW, regionH, originX, originY) {
    const offscreen = document.createElement('canvas');
    offscreen.width = regionW;
    offscreen.height = regionH;
    const context = offscreen.getContext('2d');
    const imageData = context.createImageData(regionW, regionH);
    const startX = originX === undefined ? Math.max(0, Math.floor((width - regionW) / 2)) : originX;
    const startY = originY === undefined ? Math.max(0, Math.floor((height - regionH) / 2)) : originY;
    for (let y = 0; y < regionH; y++) {
      for (let x = 0; x < regionW; x++) {
        const source = ((startY + y) * width + (startX + x)) * 4;
        const destination = (y * regionW + x) * 4;
        imageData.data[destination] = rgb[source];
        imageData.data[destination + 1] = rgb[source + 1];
        imageData.data[destination + 2] = rgb[source + 2];
        imageData.data[destination + 3] = 255;
      }
    }
    context.putImageData(imageData, 0, 0);
    target.ctx.imageSmoothingEnabled = false;
    target.ctx.drawImage(offscreen, 0, 0, target.w, target.h);
  }

  function drawPlaneInto(target, plane, width, height, tint) {
    const offscreen = document.createElement('canvas');
    offscreen.width = width;
    offscreen.height = height;
    const context = offscreen.getContext('2d');
    const imageData = context.createImageData(width, height);
    for (let i = 0; i < width * height; i++) {
      const value = clamp(Math.round(plane[i]), 0, 255);
      if (tint === 'cb') {
        imageData.data[i * 4] = clamp(255 - Math.abs(value - 128) * 2, 0, 255);
        imageData.data[i * 4 + 1] = value;
        imageData.data[i * 4 + 2] = clamp(255 - Math.abs(value - 128) * 2, 0, 255);
      } else if (tint === 'cr') {
        imageData.data[i * 4] = value;
        imageData.data[i * 4 + 1] = clamp(255 - Math.abs(value - 128) * 2, 0, 255);
        imageData.data[i * 4 + 2] = clamp(255 - Math.abs(value - 128) * 2, 0, 255);
      } else {
        imageData.data[i * 4] = value;
        imageData.data[i * 4 + 1] = value;
        imageData.data[i * 4 + 2] = value;
      }
      imageData.data[i * 4 + 3] = 255;
    }
    context.putImageData(imageData, 0, 0);
    target.ctx.imageSmoothingEnabled = false;
    target.ctx.drawImage(offscreen, 0, 0, target.w, target.h);
  }

  function chromaColor(value, tint) {
    const level = clamp(Math.round(value), 0, 255);
    const neutral = clamp(255 - Math.abs(level - 128) * 2, 0, 255);
    return tint === 'cb' ? [neutral, level, neutral] : [level, neutral, neutral];
  }

  function drawSampleGrid(target, values, width, height, tint) {
    const context = target.ctx;
    const cellWidth = target.w / width;
    const cellHeight = target.h / height;
    context.clearRect(0, 0, target.w, target.h);
    for (let row = 0; row < height; row++) {
      for (let column = 0; column < width; column++) {
        const rgb = chromaColor(values[row * width + column], tint);
        context.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        context.fillRect(column * cellWidth, row * cellHeight, cellWidth + 0.5, cellHeight + 0.5);
      }
    }
    context.strokeStyle = 'rgba(255,255,255,0.55)';
    context.lineWidth = 1;
    for (let i = 0; i <= width; i++) {
      context.beginPath(); context.moveTo(i * cellWidth, 0); context.lineTo(i * cellWidth, target.h); context.stroke();
    }
    for (let i = 0; i <= height; i++) {
      context.beginPath(); context.moveTo(0, i * cellHeight); context.lineTo(target.w, i * cellHeight); context.stroke();
    }
  }

  function drawDifferenceInto(target, a, b, width, height, scale) {
    const offscreen = document.createElement('canvas');
    offscreen.width = width;
    offscreen.height = height;
    const context = offscreen.getContext('2d');
    const imageData = context.createImageData(width, height);
    for (let i = 0; i < width * height; i++) {
      const value = clamp(Math.round(Math.abs(a[i] - b[i]) * scale), 0, 255);
      imageData.data[i * 4] = value;
      imageData.data[i * 4 + 1] = value;
      imageData.data[i * 4 + 2] = value;
      imageData.data[i * 4 + 3] = 255;
    }
    context.putImageData(imageData, 0, 0);
    target.ctx.imageSmoothingEnabled = false;
    target.ctx.drawImage(offscreen, 0, 0, target.w, target.h);
  }

  function heatColor(value, maximum, signed) {
    if (signed) {
      const level = Math.min(1, Math.log1p(Math.abs(value)) / Math.log1p(Math.max(1, maximum)));
      if (value >= 0) return [255, Math.round(255 - 190 * level), Math.round(255 - 190 * level)];
      return [Math.round(255 - 190 * level), Math.round(255 - 190 * level), 255];
    }
    const level = Math.min(1, Math.sqrt(Math.max(0, value) / Math.max(1, maximum)));
    return [Math.round(236 - 150 * level), Math.round(242 - 145 * level), Math.round(255 - 55 * level)];
  }

  function grayColor(value) {
    const level = clamp(Math.round(value), 0, 255);
    return [level, level, level];
  }

  function textColor(rgb) {
    return (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) > 158 ? '#152033' : '#ffffff';
  }

  function drawCells(target, values, colorFunction, options) {
    options = options || {};
    const context = target.ctx;
    const cellWidth = target.w / 8;
    const cellHeight = target.h / 8;
    context.clearRect(0, 0, target.w, target.h);
    for (let row = 0; row < 8; row++) {
      for (let column = 0; column < 8; column++) {
        const value = values[row * 8 + column];
        const rgb = colorFunction(value);
        context.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        context.fillRect(column * cellWidth, row * cellHeight, cellWidth, cellHeight);
        if (options.zeroMark && value === 0) {
          context.strokeStyle = '#dc2626';
          context.lineWidth = 1.7;
          const padding = 5;
          context.beginPath();
          context.moveTo(column * cellWidth + padding, row * cellHeight + padding);
          context.lineTo((column + 1) * cellWidth - padding, (row + 1) * cellHeight - padding);
          context.moveTo((column + 1) * cellWidth - padding, row * cellHeight + padding);
          context.lineTo(column * cellWidth + padding, (row + 1) * cellHeight - padding);
          context.stroke();
        }
      }
    }
    context.strokeStyle = options.gridColor || 'rgba(255,255,255,0.75)';
    context.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      context.beginPath(); context.moveTo(i * cellWidth, 0); context.lineTo(i * cellWidth, target.h); context.stroke();
      context.beginPath(); context.moveTo(0, i * cellHeight); context.lineTo(target.w, i * cellHeight); context.stroke();
    }
    if (options.text) {
      context.font = '600 11px Consolas, monospace';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      for (let row = 0; row < 8; row++) {
        for (let column = 0; column < 8; column++) {
          const value = values[row * 8 + column];
          const text = options.text(value);
          if (text === null) continue;
          const rgb = colorFunction(value);
          context.fillStyle = textColor(rgb);
          context.fillText(text, column * cellWidth + cellWidth / 2, row * cellHeight + cellHeight / 2);
        }
      }
    }
    if (typeof options.highlight === 'number' && options.highlight >= 0) {
      const row = Math.floor(options.highlight / 8);
      const column = options.highlight % 8;
      context.strokeStyle = '#111827';
      context.lineWidth = 2.5;
      context.strokeRect(column * cellWidth + 1.5, row * cellHeight + 1.5, cellWidth - 3, cellHeight - 3);
    }
  }

  function drawGridAndBlock(target, imageWidth, imageHeight) {
    const context = target.ctx;
    const blockWidth = target.w / imageWidth * 8;
    const blockHeight = target.h / imageHeight * 8;
    context.fillStyle = 'rgba(29,78,216,0.22)';
    context.fillRect(state.blockX * blockWidth, state.blockY * blockHeight, blockWidth, blockHeight);
    context.strokeStyle = '#1d4ed8';
    context.lineWidth = 2.5;
    context.strokeRect(state.blockX * blockWidth, state.blockY * blockHeight, blockWidth, blockHeight);
  }

  function drawRGBBlockPreview(target, blockX, blockY) {
    const context = target.ctx;
    const cell = target.w / 8;
    context.clearRect(0, 0, target.w, target.h);
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const sourceX = Math.min(state.width - 1, blockX * 8 + x);
        const sourceY = Math.min(state.height - 1, blockY * 8 + y);
        const index = (sourceY * state.width + sourceX) * 4;
        context.fillStyle = 'rgb(' + state.rgb[index] + ',' + state.rgb[index + 1] + ',' + state.rgb[index + 2] + ')';
        context.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
      }
    }
    context.strokeStyle = 'rgba(100,116,139,0.55)';
    context.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const position = Math.round(i * cell) + 0.5;
      context.beginPath(); context.moveTo(position, 0); context.lineTo(position, target.h); context.stroke();
      context.beginPath(); context.moveTo(0, position); context.lineTo(target.w, position); context.stroke();
    }
  }

  function statBlock(rows) {
    return '<div class="stats">' + rows.map(function (row) {
      return '<div><span>' + escapeHTML(row[0]) + '</span><b>' + row[1] + '</b></div>';
    }).join('') + '</div>';
  }

  function metricCards(rows) {
    return '<div class="cards">' + rows.map(function (row) {
      return '<div class="card"><span>' + escapeHTML(row[0]) + '</span><b>' + row[1] + '</b><small>' +
        escapeHTML(row[2] || '') + '</small></div>';
    }).join('') + '</div>';
  }

  function figure(id, caption, className) {
    return '<figure class="' + (className || '') + '"><canvas id="' + id + '"></canvas><figcaption>' + caption + '</figcaption></figure>';
  }

  /* ------------------------------------------------------------------ */
  /* 样例图像                                                            */
  /* ------------------------------------------------------------------ */

  function rgbToRGBA(pixels) {
    const output = new Uint8ClampedArray(pixels.length / 3 * 4);
    for (let i = 0, j = 0; i < pixels.length; i += 3, j += 4) {
      output[j] = pixels[i];
      output[j + 1] = pixels[i + 1];
      output[j + 2] = pixels[i + 2];
      output[j + 3] = 255;
    }
    return output;
  }

  function grayscaleToRGBA(pixels) {
    const output = new Uint8ClampedArray(pixels.length * 4);
    for (let i = 0; i < pixels.length; i++) {
      output[i * 4] = pixels[i];
      output[i * 4 + 1] = pixels[i];
      output[i * 4 + 2] = pixels[i];
      output[i * 4 + 3] = 255;
    }
    return output;
  }

  function resizeRGBA(source, sourceWidth, sourceHeight, targetWidth, targetHeight) {
    if (sourceWidth === targetWidth && sourceHeight === targetHeight) return source;
    const targetRatio = targetWidth / targetHeight;
    const sourceRatio = sourceWidth / sourceHeight;
    let cropWidth = sourceWidth;
    let cropHeight = sourceHeight;
    if (sourceRatio > targetRatio) cropWidth = Math.round(sourceHeight * targetRatio);
    else if (sourceRatio < targetRatio) cropHeight = Math.round(sourceWidth / targetRatio);
    const cropX = Math.floor((sourceWidth - cropWidth) / 2);
    const cropY = Math.floor((sourceHeight - cropHeight) / 2);
    const output = new Uint8ClampedArray(targetWidth * targetHeight * 4);
    for (let y = 0; y < targetHeight; y++) {
      const sy = cropY + Math.min(cropHeight - 1, Math.floor(y * cropHeight / targetHeight));
      for (let x = 0; x < targetWidth; x++) {
        const sx = cropX + Math.min(cropWidth - 1, Math.floor(x * cropWidth / targetWidth));
        const from = (sy * sourceWidth + sx) * 4;
        const to = (y * targetWidth + x) * 4;
        output[to] = source[from];
        output[to + 1] = source[from + 1];
        output[to + 2] = source[from + 2];
        output[to + 3] = 255;
      }
    }
    return output;
  }

  function buildSamples() {
    if (window.DEMO_PHOTOS) {
      window.DEMO_PHOTOS.forEach(function (photo) {
        const width = photo.width || 256;
        const height = photo.height || 256;
        samples.push({ name: photo.name, rgb: rgbToRGBA(base64ToBytes(photo.pixels)), width: width, height: height });
      });
    }
    DATA.images.forEach(function (image) {
      const rgb = resizeRGBA(grayscaleToRGBA(base64ToBytes(image.pixels)), image.width || 256, image.height || 256, DEMO_WIDTH, DEMO_HEIGHT);
      samples.push({ name: LABELS[image.name] || image.name, rgb: rgb, width: DEMO_WIDTH, height: DEMO_HEIGHT });
    });
  }

  function buildSampleButtons() {
    const container = document.getElementById('sampleButtons');
    samples.forEach(function (sample, index) {
      const button = document.createElement('button');
      button.textContent = sample.name;
      button.addEventListener('click', function () {
        loadImage(sample.rgb, sample.name, sample.width, sample.height);
      });
      container.appendChild(button);
    });
  }

  function loadImage(rgb, name, width, height) {
    state.imageId = ++imageSerial;
    state.rgb = rgb;
    state.width = width || DEMO_WIDTH;
    state.height = height || DEMO_HEIGHT;
    state.imageName = name;
    const block = chooseDefaultBlock();
    state.blockX = block.x;
    state.blockY = block.y;
    state.selectedCoeff = -1;
    state.basis = null;
    rebuild();
  }

  function chooseDefaultBlock() {
    const columns = Math.ceil(state.width / 8);
    const rows = Math.ceil(state.height / 8);
    let best = { x: 0, y: 0 };
    let bestScore = -1;
    for (let blockY = 0; blockY < rows; blockY++) {
      for (let blockX = 0; blockX < columns; blockX++) {
        let sum = 0;
        let squares = 0;
        for (let y = 0; y < 8; y++) {
          const sourceY = Math.min(state.height - 1, blockY * 8 + y);
          for (let x = 0; x < 8; x++) {
            const sourceX = Math.min(state.width - 1, blockX * 8 + x);
            const index = (sourceY * state.width + sourceX) * 4;
            const luma = 0.299 * state.rgb[index] + 0.587 * state.rgb[index + 1] + 0.114 * state.rgb[index + 2];
            sum += luma;
            squares += luma * luma;
          }
        }
        const mean = sum / 64;
        const variance = squares / 64 - mean * mean;
        const score = variance * (1 - Math.abs(mean - 128) / 255);
        if (score > bestScore) {
          bestScore = score;
          best = { x: blockX, y: blockY };
        }
      }
    }
    return best;
  }

  /* ------------------------------------------------------------------ */
  /* 编码 / 解码                                                         */
  /* ------------------------------------------------------------------ */

  function rebuild() {
    try {
      stopVisualAnimations();
      state.quantStep = 64;
      state.rleStep = 0;
      state.bitWriteStep = 0;
      state.decodeStep = 0;
      state.idctStep = 64;
      state.zigStep = 64;
      state.dctView = 'coeff';
      state.dctRowStep = 8;
      state.dctColStep = 8;
      state.assemblyStep = 0;
      const cacheKey = state.imageId + '|' + state.width + 'x' + state.height + '|' + state.Q + '|' + state.subsampling;
      const cached = rebuildCache.get(cacheKey);
      if (cached) {
        state.encoded = cached.encoded;
        state.decoded = cached.decoded;
        state.psnr = cached.psnr;
      } else {
        state.encoded = Codec.encode(state.rgb, state.width, state.height, {
          quality: state.Q,
          subsampling: state.subsampling
        });
        state.decoded = Codec.decode(state.encoded);
        state.psnr = Codec.psnr(state.rgb, state.decoded.rgb);
        if (rebuildCache.size >= 8) rebuildCache.delete(rebuildCache.keys().next().value);
        rebuildCache.set(cacheKey, { encoded: state.encoded, decoded: state.decoded, psnr: state.psnr });
      }
      state.assemblyStep = state.encoded.mcus.length;
      const maxBlockX = Math.ceil(state.width / 8) - 1;
      const maxBlockY = Math.ceil(state.height / 8) - 1;
      state.blockX = clamp(state.blockX, 0, maxBlockX);
      state.blockY = clamp(state.blockY, 0, maxBlockY);
      render();
    } catch (error) {
      stage.innerHTML = '<p class="error">编码失败：' + escapeHTML(error.message) + '</p>';
      console.error(error);
    }
  }

  function componentBlock(component) {
    let blockX = state.blockX;
    let blockY = state.blockY;
    if (component !== 'Y') {
      if (state.subsampling === '420' || state.subsampling === '422') blockX = Math.floor(blockX / 2);
      if (state.subsampling === '420') blockY = Math.floor(blockY / 2);
    }
    const info = state.encoded.components[component];
    return {
      x: clamp(blockX, 0, info.cols - 1),
      y: clamp(blockY, 0, info.rows - 1)
    };
  }

  function encodedBlock(component) {
    const position = componentBlock(component || state.component);
    return state.encoded.blocks.get((component || state.component) + ':' + position.x + ':' + position.y);
  }

  function decodedBlock(component) {
    const position = componentBlock(component || state.component);
    return state.decoded.blocks.get((component || state.component) + ':' + position.x + ':' + position.y);
  }

  function componentQuant(component) {
    return component === 'Y' ? state.encoded.quant.lum : state.encoded.quant.chr;
  }

  function selectedYCbCrBlock() {
    const y = new Float64Array(64);
    const cb = new Float64Array(64);
    const cr = new Float64Array(64);
    for (let row = 0; row < 8; row++) {
      for (let column = 0; column < 8; column++) {
        const sourceX = Math.min(state.width - 1, state.blockX * 8 + column);
        const sourceY = Math.min(state.height - 1, state.blockY * 8 + row);
        const index = (sourceY * state.width + sourceX) * 4;
        const r = state.rgb[index];
        const g = state.rgb[index + 1];
        const b = state.rgb[index + 2];
        const at = row * 8 + column;
        y[at] = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        cb[at] = Math.round(128 - 0.168736 * r - 0.331264 * g + 0.5 * b);
        cr[at] = Math.round(128 + 0.5 * r - 0.418688 * g - 0.081312 * b);
      }
    }
    return { y: y, cb: cb, cr: cr };
  }

  function subsampleChroma(values, mode) {
    if (mode === '444') return { data: Float64Array.from(values), width: 8, height: 8 };
    const width = 4;
    const height = mode === '420' ? 4 : 8;
    const data = new Float64Array(width * height);
    const stepY = mode === '420' ? 2 : 1;
    for (let row = 0; row < height; row++) {
      for (let column = 0; column < width; column++) {
        let sum = 0;
        for (let dy = 0; dy < stepY; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            sum += values[(row * stepY + dy) * 8 + (column * 2 + dx)];
          }
        }
        data[row * width + column] = sum / (stepY * 2);
      }
    }
    return { data: data, width: width, height: height };
  }

  function flowStep(index) {
    const entry = FLOW_ENTRIES[clamp(index, 0, FLOW_ENTRIES.length - 1)];
    const base = STEPS[entry.step];
    const override = FLOW_OVERRIDES[entry.chapter];
    const extra = override ? override(entry) : null;
    return extra ? Object.assign({}, base, extra) : base;
  }

  /* ------------------------------------------------------------------ */
  /* 小工具                                                              */
  /* ------------------------------------------------------------------ */

  function mean(values) {
    let sum = 0;
    for (let i = 0; i < values.length; i++) sum += values[i];
    return sum / values.length;
  }

  function rangeText(values, offset) {
    let minimum = Infinity;
    let maximum = -Infinity;
    for (let i = 0; i < values.length; i++) {
      minimum = Math.min(minimum, values[i] + offset);
      maximum = Math.max(maximum, values[i] + offset);
    }
    return minimum + '–' + maximum;
  }

  function entropyOf(values) {
    const histogram = new Map();
    for (let i = 0; i < values.length; i++) {
      const key = Math.round(values[i] + 128);
      histogram.set(key, (histogram.get(key) || 0) + 1);
    }
    let entropy = 0;
    histogram.forEach(function (count) {
      const probability = count / values.length;
      entropy -= probability * Math.log2(probability);
    });
    return entropy;
  }

  function maxAbsDifference(a, b) {
    let maximum = 0;
    for (let i = 0; i < a.length; i++) maximum = Math.max(maximum, Math.abs(a[i] - b[i]));
    return maximum;
  }

  function countNonZero(values) {
    let count = 0;
    for (let i = 0; i < values.length; i++) if (values[i] !== 0) count += 1;
    return count;
  }

  function countZero(values) {
    let count = 0;
    for (let i = 0; i < values.length; i++) if (values[i] === 0) count += 1;
    return count;
  }

  function trailingZeros(values) {
    let count = 0;
    for (let i = values.length - 1; i >= 0; i--) {
      if (values[i] !== 0) break;
      count += 1;
    }
    return count;
  }

  function colorBits(bits) {
    return bits.split('').map(function (bit) {
      return '<span class="' + (bit === '1' ? 'one' : 'zero') + '">' + bit + '</span>';
    }).join('');
  }

  function sameSymbols(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].kind !== b[i].kind || a[i].value !== b[i].value ||
          a[i].run !== b[i].run || a[i].size !== b[i].size) return false;
    }
    return true;
  }

  function symbolLabel(symbol) {
    if (symbol.kind === 'DC') return 'DC(' + symbol.size + ')';
    if (symbol.kind === 'EOB') return 'EOB';
    if (symbol.kind === 'ZRL') return 'ZRL';
    return '(' + symbol.run + ',' + symbol.size + ')';
  }

  function symbolTable(symbols, limit) {
    const rows = symbols.slice(0, limit || 24).map(function (symbol) {
      return '<tr><td>' + symbolLabel(symbol) + '</td><td>' + (symbol.kind === 'AC' || symbol.kind === 'DC' ? symbol.value : '—') +
        '</td><td><code>' + symbol.code + '</code></td><td>' + symbol.code.length + '</td><td><code>' +
        (symbol.amplitude || '—') + '</code></td></tr>';
    }).join('');
    return '<div class="scroll"><table class="data"><thead><tr><th>符号</th><th>值</th><th>码字</th><th>码长</th><th>幅值位</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>' + (symbols.length > (limit || 24) ? '<p class="note">仅显示前 ' + (limit || 24) + ' 个符号，共 ' + symbols.length + ' 个。</p>' : '');
  }

  /* ------------------------------------------------------------------ */
  /* 各步骤可视化                                                        */
  /* ------------------------------------------------------------------ */

  function renderSourceStep() {
    stage.innerHTML = '<div class="source-layout">' +
      figure('sourceCanvas', '悬浮实时预览，点击确认分析块', 'source-figure') +
      '<div class="block-preview">' +
      '<div class="block-preview-head" id="blockPreviewHead"></div>' +
      '<canvas id="blockPreview"></canvas>' +
      '<p class="note">鼠标悬浮实时预览；点击左侧图像确认分析块，后续步骤的 8×8 数据都使用这一块。</p>' +
      '</div></div>';
    const target = setupCanvas('sourceCanvas', SOURCE_CANVAS_WIDTH, SOURCE_CANVAS_HEIGHT);
    const preview = setupCanvas('blockPreview', 240, 240);
    const head = document.getElementById('blockPreviewHead');
    target.canvas.style.maxWidth = 'min(100%, calc(100vh - 230px), 820px)';
    drawRGBInto(target, state.rgb, state.width, state.height);
    drawGridAndBlock(target, state.width, state.height);

    function showBlock(blockX, blockY, hovering) {
      drawRGBBlockPreview(preview, blockX, blockY);
      head.innerHTML = (hovering ? '悬浮 8×8 块' : '当前 8×8 块') +
        ' <b>(' + blockX + ', ' + blockY + ')</b>';
    }

    function blockAt(event) {
      const rectangle = target.canvas.getBoundingClientRect();
      const x = (event.clientX - rectangle.left) / rectangle.width * state.width;
      const y = (event.clientY - rectangle.top) / rectangle.height * state.height;
      return {
        x: clamp(Math.floor(x / 8), 0, Math.ceil(state.width / 8) - 1),
        y: clamp(Math.floor(y / 8), 0, Math.ceil(state.height / 8) - 1)
      };
    }

    state.hoverBlock = null;
    showBlock(state.blockX, state.blockY, false);

    target.canvas.addEventListener('mousemove', function (event) {
      const block = blockAt(event);
      if (state.hoverBlock && state.hoverBlock.x === block.x && state.hoverBlock.y === block.y) return;
      state.hoverBlock = block;
      showBlock(block.x, block.y, true);
    });

    target.canvas.addEventListener('mouseleave', function () {
      state.hoverBlock = null;
      showBlock(state.blockX, state.blockY, false);
    });

    target.canvas.addEventListener('click', function (event) {
      const block = blockAt(event);
      state.blockX = block.x;
      state.blockY = block.y;
      state.hoverBlock = null;
      state.selectedCoeff = -1;
      state.basis = null;
      refreshSourceCanvas();
      renderLeft();
    });
  }

  function renderColorStep() {

      figure('colorCb', 'Cb 蓝色差 8×8 · 范围 ' + rangeText(block.cb, 0)) +
      figure('colorCr', 'Cr 红色差 8×8 · 范围 ' + rangeText(block.cr, 0)) +
      '</div><p class="note" style="margin-top:8px">只转换第一步选中的 8×8 块；Cb/Cr 以 128 为中性值。</p>';
    drawRGBBlockPreview(colorCanvas('colorRGB'), state.blockX, state.blockY);
