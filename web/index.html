<style>
  :root{
    --bg:#e9eef6; --panel:#fff; --line:#d5dfeb; --text:#152033; --muted:#5a6b83;
    --blue:#1d4ed8; --blue-soft:#e8efff; --teal:#0f766e; --orange:#c2410c;
    --red:#dc2626; --green:#15803d;
    --surface-soft:#f8fafc; --border-soft:#e6edf6;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05); --shadow-md:0 5px 16px rgba(15,23,42,.07);
    --cell-empty:#eef2f7; --cell-blue:#1a589a; --cell-red:#ff4141;
    --ease-standard:cubic-bezier(.22,.61,.36,1);
    --ease-emphasis:cubic-bezier(.34,1.2,.64,1);
    --dur-fast:160ms; --dur-base:260ms; --dur-slow:380ms;
    /* 量化页四宫格：图块边长与宫格总宽联动，宫格在首屏里铺开；
       算式区不在演示台内，而是挂在下方说明面板里，滚动才看见。 */
    --quant-tile:clamp(210px,36vh,400px);
    --quant-grid-w:calc(var(--quant-tile) * 2 + 82px);
    /* 演示台与说明面板共用的列宽上限：两者始终同宽、同边距，
       换分辨率（1080p / 1440p / 4K）时左右边缘都不会错开 */
    --main-col-max:min(94vw,1380px);
  }
  *{box-sizing:border-box}
  /* 屏幕阅读器专用文本与跳转链接：可视区域不变，只为键盘/读屏用户提供入口 */
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  .skip-link{position:fixed;top:-60px;left:12px;z-index:120;padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;font-size:13px;text-decoration:none;box-shadow:var(--shadow-md);transition:top var(--dur-fast) var(--ease-standard)}
  .skip-link:focus{top:10px}
  .noscript-note{max-width:640px;margin:80px auto;padding:16px 20px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:14px;text-align:center}
  /* 统一键盘焦点指示；鼠标点击不会出现，不影响原有视觉 */
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  button{transition:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),transform var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
  button:active{transform:scale(.98)}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  .app{position:relative;width:100%;height:100vh;margin:0;padding:0;overflow:hidden}
  /* 宽度与 .main>.right / .main>.left 的内容列一致（min(94vw,1380px)），左右边缘与演示台卡片对齐 */
  .stepper{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:28;display:flex;gap:6px;overflow-x:auto;padding:7px;width:min(94vw,1380px);max-width:calc(100vw - 24px);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;scrollbar-width:none;backdrop-filter:blur(8px);box-shadow:var(--shadow-md)}
  .stepper button{border:1px solid transparent;background:transparent;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--muted)}
  .stepper button:hover{background:var(--surface-soft);border-color:var(--border-soft);color:var(--text)}
  .stepper button .n{font-family:Consolas,monospace;font-weight:700;margin-right:4px;color:#94a3b8}
  .stepper button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 7px rgba(29,78,216,.24)}
  .stepper button.on .n{color:rgba(255,255,255,.75)}
  .main{--main-top:8px;--main-bottom:62px;--main-pad-top:8px;--main-pad-bottom:18px;position:absolute;top:var(--main-top);bottom:var(--main-bottom);left:0;right:0;display:flex;flex-direction:column;gap:12px;padding:var(--main-pad-top) 12px var(--main-pad-bottom);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
  .left{flex:0 0 auto;background:linear-gradient(180deg,#fff 0%,#fcfdff 100%);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow-sm);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) minmax(0,1fr);gap:0 30px;align-items:start}
  .panel-col{display:flex;flex-direction:column;min-width:0}
  .panel-col>.sec:first-child{border-top:0;padding-top:0;margin-top:0}
  .step-kicker{font:700 11px/1 Consolas,monospace;color:var(--blue);letter-spacing:.8px}
  .left h2{font-size:20px;line-height:1.34;letter-spacing:-.2px;margin:9px 0 10px}
  .lead{color:#3b4a60;font-size:13px;line-height:1.72;margin:0}
  .sec{border-top:1px solid #e9eff7;padding-top:13px;margin-top:13px}
  .sec h3{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#64748b;margin:0 0 8px;font-weight:700;letter-spacing:.6px}
  .sec h3::before{content:"";width:3px;height:11px;border-radius:2px;background:#9db8f5}
  .sec p{margin:0 0 8px;color:#3b4a60;font-size:12.8px;line-height:1.74}
  .sec p:last-child{margin-bottom:0}
  .sec b{color:#0f172a}
  .formula{background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:9px;padding:10px 12px;font:11.5px/1.72 Consolas,"Cascadia Mono",monospace;color:#1e293b;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:9px 0 0}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kv-grid div{background:#f6f8fc;border:1px solid #e3eaf4;border-radius:8px;padding:7px 9px}
  .kv-grid span{display:block;font-size:10.5px;color:var(--muted)}
  .kv-grid b{font-size:13px;font-variant-numeric:tabular-nums}
  ul.tips{margin:0;padding-left:16px;color:#3b4a60;font-size:12.8px;line-height:1.7}
  ul.tips li{margin:4px 0}
  ul.tips li::marker{color:#9db8f5}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:12.5px}
  .tools button:hover{border-color:#9db8f5;background:var(--blue-soft);color:var(--blue)}
  .tools button.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 7px rgba(29,78,216,.22)}
  .tools button.primary:hover{background:#1a45c4;color:#fff}
  .right{min-width:0;display:flex;flex:0 0 auto}
  .main>.right,.main>.left{width:100%;max-width:var(--main-col-max);margin-left:auto;margin-right:auto}
  .stage{background:linear-gradient(180deg,#fff 0%,#fcfdff 100%);border:1px solid var(--line);border-radius:16px;padding:20px 22px;flex:1;min-width:0;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-height:calc(100vh - var(--main-top) - var(--main-bottom) - var(--main-pad-top) - var(--main-pad-bottom))}
  .stage>*{flex-shrink:0}
  /* 移动端浏览器地址栏会吃掉 100vh，支持 dvh 时改用动态视口高度 */
  @supports (height:100dvh){
    .app{height:100dvh}
    .stage{min-height:calc(100dvh - var(--main-top) - var(--main-bottom) - var(--main-pad-top) - var(--main-pad-bottom))}
  }
  .stage>:first-child{margin-top:auto}
  .stage>:last-child{margin-bottom:auto}
  .stage.enter{animation:stageIn var(--dur-slow) var(--ease-standard)}
  @keyframes stageIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
  .stage-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;margin-top:8px}
  .stage-btn:hover{border-color:#9db8f5;background:var(--blue-soft);color:var(--blue)}
  .stage-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 7px rgba(29,78,216,.22)}
  /* 矮屏兜底：画布已缩到下限还装不下时，收紧演示台内部的字号与留白再试一次 */
  .stage.compact{padding:12px 15px}
  .stage.compact .note,.stage.compact .subcap,.stage.compact figcaption{font-size:11.5px;line-height:1.5}
  .stage.compact .stats div{padding:5px 8px}
  .stage.compact .stats span{font-size:10.5px}
  .stage.compact .cards{gap:8px}
  .stage.compact .cards .card{padding:8px 10px}
  .stage.compact .bits{font-size:11px;line-height:1.5;max-height:96px;padding:6px}
  .stage.compact table.data th,.stage.compact table.data td{padding:3px 7px;font-size:11.5px}
  .stage.compact .hvs-block{padding:10px 12px}
  .stage.compact .hvs-conclusion{padding:7px 10px;font-size:12px;margin-top:10px}
  .stage.compact .matlab-ref{padding:8px 12px;margin-top:10px}
  .stage.compact .matlab-takeaway{font-size:11.5px;line-height:1.55;padding:8px 10px;margin-top:8px}
  .stage.compact .scroll{max-height:200px}
  /* 07.3 的标准表截图不是画布，自适应缩放管不到它：紧凑档里直接压低表图高度（点开仍可看原图） */
  .stage.compact .t81-tables img{max-height:clamp(200px,28vh,420px)}
  /* 宽屏把指标卡铺成一行，省下的高度留给画布 */
  @media (min-width:1100px){
    .stage .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
    .stage .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
    /* 说明面板里的算例统计卡同样铺成一行，省得占两行高度 */
    .panel-quant .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  table.data tr.done{color:#8190a6}
  table.data tbody tr:nth-child(even) td{background:#fafcff}
  table.data tbody tr.active td{background:#fff1d6}
  .stage-flex{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .stage-col{flex:1;min-width:0}
  .stage-col.hug{flex:0 1 auto}
  /* 系数页：左列放矩阵与两张贡献图，右列让 64 张基图纵贯上下 */
  .dct-coeff-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .dct-coeff-left{display:flex;flex-direction:column;gap:12px;min-width:0}
  .dct-2d-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;justify-content:center;align-items:start}
  .dct-2d-col{display:flex;flex-direction:column;gap:10px;min-width:0;align-items:center}
  .dct-2d-col figure{display:flex;flex-direction:column;align-items:center;width:100%}
  .dct-2d-col figcaption{align-self:flex-start}
  .dct-shift-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:16px}
  .dct-rebuild-row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;margin-bottom:14px}
  .dct-rebuild-row4 figure{display:flex;flex-direction:column;align-items:center}
  .dct-rebuild-row4 canvas{max-width:340px;margin:0 auto}
  .dct-rebuild-row4 figcaption{text-align:left;line-height:1.45}
  /* 基图索引可点：点哪一张就跳到它刚被加入的那一步 */
  .dct-rebuild-row4 #rebuildBasisIndex{cursor:pointer}
  .dct-1d-figure{display:flex;flex-direction:column;align-items:center}
  .dct-1d-figure figcaption{align-self:flex-start}
  .dct-use-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .dct-use-row>.note{margin-right:4px}
  .dct-use-row button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
  .dct-use-row button:hover{border-color:#9fb3cc}
  .dct-use-row button.on{background:var(--blue-soft);border-color:#9db8f5;color:var(--blue);font-weight:600}
  .dct-use-row button:disabled{opacity:.4;cursor:not-allowed}
  .dct-row-picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .dct-row-picker>.note{margin-left:4px}
  .dct-row-picker button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--muted);cursor:pointer}
  .dct-row-picker button.on{background:var(--blue-soft);border-color:#9db8f5;color:var(--blue)}
  /* 一维页顶部只是索引区：空间域像素与频率域系数各压成一条单行卡片，
     高度让给下面的逐步逼近大图（图注/读数都在卡片与控制条里，不另占行） */
  .dct-strips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch;max-width:1040px;margin-bottom:6px}
  .dct-strip-col{min-width:0;display:flex;align-items:center;gap:10px;padding:4px 9px;border:1px solid #e3eaf4;border-radius:10px;background:#fff}
  .dct-strip-head{flex:0 0 104px;display:flex;flex-direction:column;gap:1px;margin:0;font:600 10.5px/1.35 "Microsoft YaHei",sans-serif;color:#475569}
  .dct-strip-head em{font:400 9.5px/1.35 "Microsoft YaHei",sans-serif;font-style:normal;color:#94a3b8;white-space:nowrap}
  .dct-cells{flex:1 1 auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
  .dct-cells span{display:flex;align-items:center;justify-content:center;min-width:0;aspect-ratio:1/1;border-radius:5px;font:600 11px/1 Consolas,monospace;box-shadow:inset 0 0 0 1px rgba(15,23,42,.06)}
  .dct-cells span.pending{background:#fbfdff;border:1px dashed #c2cfdd;box-shadow:none;color:#9aa8bb;font-weight:400}
  .dct-1d-top{margin-bottom:4px}
  .dct-1d-top .dct-row-picker{margin-bottom:6px}
  .dct-1d-top .dct-row-picker button{padding:2px 7px;font-size:10.5px}
  .dct-1d-top .dct-use-row{margin-bottom:0}
  /* DCT ② 基函数页的公式卡：主式用数学衬线排版，上标下标与分数线都按排版规矩走，
     定义（α、n）与正交性放在下面一行小字，避免全部挤在一条基线上 */
  .dct-cosine-formula{display:flex;flex-direction:column;align-items:center;gap:9px;
    width:100%;max-width:900px;margin:8px auto 2px;padding:14px 20px 12px;
    background:linear-gradient(180deg,#fbfdff 0%,#f5f8fd 100%);border:1px solid var(--border-soft);border-radius:12px;
    box-shadow:var(--shadow-sm)}
  .dcf-eq{display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.5;
    font-family:"Cambria Math","Latin Modern Math","STIX Two Math",Cambria,Georgia,"Times New Roman",serif;
    font-size:clamp(17px,1.35vw,22px);color:#0f172a;white-space:nowrap}
  .dcf-eq i,.dcf-legend i{font-style:italic;padding-right:.02em}
  .dcf-eq sub,.dcf-legend sub{font-size:.62em;line-height:0;vertical-align:-.28em;font-style:italic}
  .dcf-op{color:#64748b;margin:0 2px}
  .dcf-cos{margin-left:2px;letter-spacing:.01em}
  /* 方括号画出来而不是打字符：高度自动跟随分数线，不用挑字号 */
  .dcf-bracket{align-self:stretch;width:6px;margin:0 4px;border:1.5px solid #94a3b8;border-right:0;border-radius:3px 0 0 3px}
  .dcf-bracket.end{border:1.5px solid #94a3b8;border-left:0;border-radius:0 3px 3px 0;margin:0 2px 0 4px}
  .dcf-frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.86em;line-height:1.18}
  .dcf-num{padding:0 6px 1px}
  .dcf-den{padding:1px 8px 0;border-top:1.4px solid currentColor}
  .dcf-legend{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 10px;
    font-size:12.5px;line-height:1.75;color:#52627a}
  .dcf-note{white-space:nowrap}
  .dcf-note .dcf-m{font-family:"Cambria Math","Latin Modern Math",Cambria,Georgia,"Times New Roman",serif;
    font-size:13.5px;color:#1e3a8a}
  .dcf-sep{color:#cbd5e1}
  /* 根号：√ 字符 + 被开方数上方的横线，凑成书上那种带顶线的根号 */
  .dcf-sqrt{display:inline-block;color:inherit}
  .dcf-rad{border-top:1.4px solid currentColor;padding:0 2px 0 1.5px;margin-left:-1.5px}
  /* 宽屏：主式在左、两条定义在右，竖线分隔，公式卡不会左右各留一大片空白 */
  @media (min-width:820px){
    .dct-cosine-formula{flex-direction:row;justify-content:center;gap:26px;padding:14px 24px}
    .dcf-legend{flex-direction:column;align-items:flex-start;gap:1px;padding-left:26px;border-left:1px solid var(--border-soft)}
    .dcf-sep{display:none}
  }
  @media (max-width:900px){
    .dct-cosine-formula{padding:12px 12px 10px}
    .dcf-note{white-space:normal;text-align:center}
  }
  /* 05.2 只有一条空间域色带：单列铺满、格子压成矮条，
     高度让给下面的坐标系；圆角与站内其它卡片一致 */
  .dct-strips.single{grid-template-columns:minmax(0,1fr);max-width:100%;margin:0 0 10px}
  .dct-strips.single .dct-strip-col{padding:9px 14px;gap:16px}
  .dct-strips.single .dct-strip-head{flex:0 0 182px;gap:3px;padding-right:14px;
    border-right:1px solid var(--border-soft);font-size:13px}
  .dct-strips.single .dct-strip-head em{font-size:11px}
  .dct-strips.single .dct-cells{gap:10px}
  .dct-strips.single .dct-cells span{aspect-ratio:auto;height:clamp(40px,5.6vh,56px);border-radius:9px;
    font:600 clamp(12.5px,1.55vh,15px)/1 Consolas,"Cascadia Mono",monospace;
    box-shadow:inset 0 0 0 1px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.05)}
  /* 窄屏：表头改到色带上方，8 个格子才不至于被挤成细条 */
  @media (max-width:760px){
    .dct-strips.single .dct-strip-col{flex-direction:column;align-items:stretch;gap:7px;padding:9px 11px}
    .dct-strips.single .dct-strip-head{flex:0 0 auto;flex-direction:row;align-items:baseline;gap:8px;
      padding-right:0;border-right:0}
    .dct-strips.single .dct-cells{gap:5px}
    .dct-strips.single .dct-cells span{height:clamp(34px,4.6vh,46px);font-size:12px;border-radius:7px}
  }
  @media (max-width:900px){.dct-strips{grid-template-columns:1fr}}
  /* 行列两遍页：底部“当前这一行/列”宽图与上方三张矩阵同宽，图注与读数已移除 */
  .dct-pass-row{margin-top:10px}
  .dct-pass-row canvas{max-width:100%;margin:0 auto}
  /* 游程编码页：前 4 个典型符号的解剖卡 */
  .rle-anatomy{margin-top:18px}
  .rle-anatomy .subcap{margin-bottom:8px;font-size:12.5px}
  .rle-anatomy-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .rle-anatomy-card{min-width:0;padding:11px 14px;border:1px solid var(--border-soft);border-radius:10px;background:#fbfdff}
  .rle-anatomy-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .rle-anatomy-head b{font:700 16px/1.1 Consolas,monospace;color:#1d4ed8}
  .rle-anatomy-head em{font-style:normal;font-size:11.5px;color:#94a3b8}
  .rle-anatomy-card p{margin:0;font-size:13px;line-height:1.6;color:#52627a}
  .rle-anatomy-bits{margin-top:4px!important}
  .rle-anatomy-bits b{font-family:Consolas,monospace;color:#b45309;background:#fff3d6;border-radius:4px;padding:0 4px}
  @media (max-width:900px){
    .rle-anatomy-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  .dct-term-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px;padding-top:12px;border-top:1px dashed #e2e8f0}
  .dct-coeff-left .dct-term-row{margin-top:0;padding-top:0;border-top:0}
  .dct-term-row figure{display:flex;flex-direction:column;align-items:center}
  .dct-term-row canvas{max-width:360px;margin:0 auto}
  .dct-term-row figcaption{text-align:left;line-height:1.5}
  .source-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:center;width:100%}
  .source-figure{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center}
  .source-figure canvas{margin:0 auto;cursor:crosshair}
  .source-figure figcaption{text-align:center}
  .block-preview{width:100%;min-width:0;background:#f8fafc;border:1px solid #e3eaf4;border-radius:12px;padding:12px}
  .block-preview-head{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .block-preview-head b{color:var(--text);font-variant-numeric:tabular-nums}
  .block-preview canvas{max-width:100%;margin:0 auto}
  .block-preview .note{margin:8px 0 0;font-size:11.5px;line-height:1.5}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .color-grid figure{display:flex;flex-direction:column;align-items:center}
  .color-grid canvas{margin:0 auto}
  .color-grid figcaption{text-align:center}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  /* 07.4 位流页：两张统计图 + 正方形 MCU 方块图同排；行高由正方形那张决定，两张图垂直居中 */
  .bit-overview{align-items:center}
  .bit-overview figure{justify-content:flex-start}
  .bit-overview canvas{margin:0 auto}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  /* 03.1 整幅图 RGB → YCbCr：三列网格。
     第一列上排原图、下排 Y 分量（原图压在 Y 头上），公式横跨第二、三列，落在 Cb/Cr 上方 */
  .ycc-board{display:grid;grid-template-columns:var(--ycc-cols,repeat(3,minmax(0,1fr)));
    gap:14px 16px;justify-content:center;align-items:start;width:100%;margin:0 0 12px}
  .ycc-board>.ycc-src{grid-area:1 / 1 / 2 / 2}
  .ycc-board>.ycc-formula-card{grid-area:1 / 2 / 2 / 4}
  .ycc-board>.ycc-y{grid-area:2 / 1 / 3 / 2}
  .ycc-board>.ycc-cb{grid-area:2 / 2 / 3 / 3}
  .ycc-board>.ycc-cr{grid-area:2 / 3 / 3 / 4}
  .ycc-src canvas{width:100%}
  /* 公式卡填满它跨到的那两列，内容垂直居中 */
  .ycc-formula-card{margin:0;height:100%;display:flex;flex-direction:column;justify-content:center;
    width:100%;max-width:100%;padding:12px 20px 10px;
    background:linear-gradient(180deg,#fbfdff 0%,#f5f8fd 100%);border:1px solid var(--border-soft);
    border-radius:12px;box-shadow:var(--shadow-sm)}
  .ycc-eq{display:flex;align-items:center;justify-content:center;gap:10px 12px;flex-wrap:wrap;
    font-family:"Cambria Math","Latin Modern Math",Cambria,Georgia,"Times New Roman",serif;color:#0f172a}
  /* 方括号用左右边框画，高度自动跟随行数，不用挑字号 */
  .ycc-mat{display:grid;align-items:center;justify-items:center;gap:1px 0;padding:5px 11px;
    border-left:1.6px solid #94a3b8;border-right:1.6px solid #94a3b8;border-radius:3px}
  .ycc-mat.vec{grid-template-columns:minmax(0,1fr)}
  .ycc-mat.mat3{grid-template-columns:repeat(3,auto);gap:2px 12px;padding:5px 13px}
  .ycc-mat i{font-style:normal;line-height:1.5;white-space:nowrap}
  .ycc-mat .num{font:600 13.5px/1.5 Consolas,"Cascadia Mono",monospace;color:#1e293b;font-variant-numeric:tabular-nums}
  .ycc-mat .var{font:italic 600 17px/1.5 "Cambria Math",Cambria,Georgia,serif;color:#1e3a8a;padding:0 2px}
  .ycc-mat .var sub{font-size:.66em;line-height:0;vertical-align:-.24em;letter-spacing:0}
  .ycc-mat.vec .num{color:#64748b}
  .ycc-op{font-size:19px;color:#475569;padding:0 1px}
  .ycc-formula-note{margin:9px 0 0;text-align:center;font-size:12px;line-height:1.65;color:#64748b}
  .ycc-formula-note b{color:#334155}
  .ycc-fig{display:flex;flex-direction:column;align-items:center;min-width:0}
  .ycc-fig canvas{width:100%;margin:0 auto}
  .ycc-fig figcaption{text-align:center;line-height:1.55}
  .ycc-tag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;
    font:700 11px/1.7 Consolas,"Cascadia Mono",monospace;color:#fff;background:#475569;vertical-align:1px}
  .ycc-y .ycc-tag{background:#334155}
  .ycc-cb .ycc-tag{background:#1d4ed8}
  .ycc-cr .ycc-tag{background:#b91c1c}
  @media (max-width:900px){
    /* 窄屏放不下三列：整块改成单列，顺序依次是原图、公式、Y、Cb、Cr */
    .ycc-board{--ycc-cols:minmax(0,1fr);gap:12px;max-width:460px}
    .ycc-board>*{grid-area:auto!important}
    .ycc-eq{gap:6px 8px}
    .ycc-mat .num{font-size:12px}
    .ycc-mat.mat3{gap:2px 8px;padding:4px 8px}
    .ycc-mat .var{font-size:15px}
  }
  /* 矮屏（投影常见 1280×720 / 1366×768）：公式卡只剩两列宽，字号与列间距同步收一档才排得下 */
  @media (max-height:820px){
    .ycc-mat{padding:4px 8px}
    .ycc-mat.mat3{gap:2px 7px;padding:4px 9px}
    .ycc-mat .num{font-size:11.5px}
    .ycc-mat .var{font-size:14.5px}
    .ycc-op{font-size:16px}
    .ycc-eq{gap:7px 8px}
    .ycc-formula-note{font-size:11.5px}
  }
  /* 量化页：左边四宫格（F → q → 商 → Fq），右边一条 QF 拉杆；
     算式区仍挂在下方说明面板里，滚动才看见 */
  .quant-layout{display:flex;align-items:center;justify-content:center;gap:18px;width:100%;margin:0 auto}
  .quant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,calc(var(--quant-tile) + 34px)));justify-content:center;align-content:center;gap:16px 24px;align-items:start;width:100%;max-width:var(--quant-grid-w);margin:0 auto}
  /* 拉杆面板与宫格同排时，宫格的 margin:auto 会吞掉主轴剩余空间，把面板顶到最右侧 */
  .quant-layout>.quant-grid{margin:0}
  .quant-grid figure{display:flex;flex-direction:column;align-items:center;width:100%;min-width:0}
  /* setupCanvas 会给每块画布写行内 max-width，这一页的图块尺寸统一由宫格变量决定，覆盖它 */
  .quant-grid canvas{width:100%;max-width:var(--quant-tile)!important;margin:0 auto}
  .quant-grid figcaption{text-align:center;line-height:1.45;margin-top:8px}
  /* QF 面板：一条拉杆 + scale / 平均步长 / 置零 三个即时读数 */
  .quant-qf{flex:0 0 clamp(268px,22vw,320px);display:flex;flex-direction:column;gap:9px;min-width:0;
    background:#f8fafc;border:1px solid #e3eaf4;border-radius:14px;padding:13px 15px 14px}
  .quant-qf .qf-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .quant-qf .qf-head h3{margin:0;font-size:12px;font-weight:700;color:#334155;letter-spacing:.4px}
  .quant-qf .qf-head span{font-size:11px;color:var(--muted)}
  .quant-qf .qf-head b{font:700 17px/1 Consolas,monospace;color:var(--blue);margin-left:2px}
  .quant-qf p{margin:0;font-size:11.5px;line-height:1.6;color:var(--muted)}
  .qf-range{display:flex;flex-direction:column;gap:1px}
  .qf-range input[type=range]{width:100%;margin:0;accent-color:var(--blue);cursor:pointer}
  .qf-range .qf-ends{display:flex;justify-content:space-between;font-size:10.5px;color:#94a3b8}
  .qf-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .qf-meta div{background:#fff;border:1px solid #e6edf6;border-radius:8px;padding:4px 7px;min-width:0}
  .qf-meta span{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
  .qf-meta b{display:block;font:700 12px/1.5 Consolas,monospace;color:#152033;white-space:nowrap}
  /* 说明面板里的算例区：横跨三列，与上方说明之间用一条虚线隔开 */
  .panel-quant{grid-column:1/-1;margin-top:18px;padding-top:14px;border-top:1px dashed #e2e8f0}
  .panel-quant .quant-work{max-width:1040px;margin:0 auto}
  .quant-foot{width:100%;max-width:1040px;margin:12px auto 0}
  .sub-compare{margin-top:18px;padding-top:14px;border-top:1px dashed #e2e8f0}
  .sub-compare-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
  .sub-compare-head span{font-weight:400;color:var(--muted);font-size:11.5px}
  .sub-compare figure{display:flex;flex-direction:column;align-items:center}
  .sub-compare canvas{margin:0 auto}
  .sub-compare figcaption{text-align:center}
  .sub-compare .note{margin:9px 0 0;line-height:1.6}
  /* 两幅并排：等宽列 + 同一个尺寸上限，左右画面大小、标题位置完全对齐 */
  .freq-region-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;margin:0 auto 16px;max-width:1260px}
  .freq-pane{display:flex;flex-direction:column;min-width:0}
  .freq-pane-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
  .freq-pane-head span{font-weight:400;color:var(--muted);font-size:11.5px}
  .freq-pane figure{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
  .freq-pane figcaption{text-align:center;line-height:1.5}
  .freq-pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .freq-pair{display:flex;flex-direction:column;gap:8px;min-width:0}
  .freq-pair figure{display:flex;flex-direction:column;align-items:center}
  .freq-pair figure.hvs-solid{height:auto}
  .freq-pair canvas{margin:0 auto}
  .freq-pair figcaption{text-align:center;line-height:1.5}
  /* 缩小演示的说明条：两幅图下方单独一行，不挤占右侧画面宽度 */
  .freq-zoom-side{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1260px;margin:0 auto;padding:10px 14px;background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:10px}
  .freq-zoom-side .stage-btn{margin-top:0;flex:0 0 auto}
  .freq-zoom-side .note{margin:0;flex:1 1 260px;line-height:1.6}
  /* MATLAB 实测页的图例：一行彩色短划 + 名称，画在画布外，省下画布内部高度 */
  .matlab-legend{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin:0 0 6px;font-size:11.5px;color:#52627a}
  .matlab-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .matlab-legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
  .matlab-ref{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fbfcfe}
  .matlab-ref>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .matlab-ref>summary::-webkit-details-marker{display:none}
  .matlab-ref>summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform var(--dur-fast) var(--ease-standard)}
  .matlab-ref[open]>summary::before{transform:rotate(90deg)}
  .matlab-ref[open]>summary{margin-bottom:10px}
  .matlab-ref-head{font-size:13px;font-weight:600;color:var(--text);margin-bottom:0}
  .matlab-ref-head span{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.5}
  .matlab-ref-live{font-size:12px;color:#1e3a8a;background:var(--blue-soft);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:8px 10px;margin:0 0 10px;line-height:1.7}
  /* 10.2–10.4 的结论条：一页只留一句结论，数字由 JS 按实测数据现算，避免写死 */
  .matlab-takeaway{display:flex;align-items:flex-start;gap:9px;margin:10px 0 0;padding:9px 12px;border-left:3px solid #0f766e;border-radius:0 9px 9px 0;background:#f0fdfa;color:#134e4a;font-size:12.5px;line-height:1.65}
  .matlab-takeaway b{flex:none;font-size:11.5px;letter-spacing:.02em;color:#0f766e;padding-top:1px}
  /* 08.4 里合并进来的二次压缩：两图并排即可，不再单独占一整页 */
  .second-pass-grid{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:12px;justify-content:center;margin-top:10px}
  .matlab-ref-scroll{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .matlab-ref table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  .matlab-ref th,.matlab-ref td{padding:5px 8px;text-align:right;border-bottom:1px solid #eef2f7;white-space:nowrap}
  .matlab-ref th{position:sticky;top:0;background:#f1f5f9;font-weight:600;color:#475569}
  .matlab-ref th:first-child,.matlab-ref td:first-child{text-align:left}
  .matlab-ref tbody tr.hit td{background:#eef4ff;color:var(--blue);font-weight:600}
  .matlab-ref-foot{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.5}
  .quant-work{width:100%;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfe}
  .quant-work-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text);margin-bottom:10px}
  .quant-work-head span{font-size:11px;color:var(--muted)}
  .quant-equation{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .q-chip{display:flex;flex-direction:column;gap:2px;min-width:78px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .q-chip em{font-style:normal;font-size:10.5px;color:var(--muted)}
  .q-chip b{font-family:Consolas,monospace;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
  .q-chip.q-out{border-color:#9db8f5;background:var(--blue-soft)}
  .q-op{font-size:12px;font-weight:700;color:var(--blue)}
  .quant-work .note{margin:6px 0 0;line-height:1.6}
  /* setupCanvas 按栅格上限写过行内 max-width，这里把标尺宽度锁回量程图需要的 660 */
  #quantRuler{display:block;width:100%;max-width:660px!important;margin:10px auto 0}
  .hvs-crop canvas{image-rendering:pixelated}
  figure{margin:0}
  figcaption,.cap{font-size:12.5px;color:#475569;line-height:1.55;margin:6px 0 0}
  canvas{display:block;width:100%;margin-left:auto;margin-right:auto;border-radius:11px;background:var(--surface-soft);border:1px solid var(--border-soft);box-shadow:var(--shadow-sm)}
  /* 演示台里的图默认居中，画布被压窄后不会一边留白 */
  .stage figure{display:flex;flex-direction:column;align-items:center}
  .stage figure>figcaption{text-align:center}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stats div{background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--border-soft);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow-sm)}
  .stats span{display:block;font-size:11.5px;color:var(--muted)}
  .stats b{font-size:14.5px;font-variant-numeric:tabular-nums}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .card{background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--border-soft);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow-sm)}
  .card span{display:block;font-size:11.5px;color:var(--muted)}
  .card b{font-size:20px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .card small{display:block;color:var(--muted);font-size:11px}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data th{text-align:left;color:var(--muted);font-weight:700;background:var(--surface-soft);border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
  table.data td{padding:7px 8px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
  table.data code{font-family:Consolas,monospace;color:#1e3a8a}
  /* Huffman 表页：直接展示 T.81 标准原文截图（Table K.3 / K.5） */
  /* K.3 全表 + K.5 上下两半固定三列；K.3 只有三列内容，列宽让给 K.5 两张 */
  .t81-tables{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.07fr) minmax(0,1.07fr);
    gap:12px;align-items:start;margin-top:8px}
  .t81-tables figure{margin:0;display:flex;flex-direction:column;align-items:center;background:#fff;
    border:1px solid var(--border-soft);border-radius:11px;padding:10px;cursor:zoom-in;
    transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
  .t81-tables figure:hover{border-color:#9db8f5;box-shadow:0 4px 14px rgba(29,78,216,.12)}
  .t81-tables figure:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  /* 表图放在页面上方，尽量放大占满可用高度；缩到列宽仍然看不清的，点开看原尺寸 */
  .t81-tables img{display:block;max-width:100%;max-height:clamp(400px,50vh,640px);object-fit:contain;background:#fff}
  /* 标准表原图放大层：三列里的小字看不清时点开，按原尺寸铺满窗口 */
  .zoom-layer{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;padding:24px;background:rgba(15,23,42,.86);cursor:zoom-out}
  .zoom-layer.on{display:flex;animation:zoomIn var(--dur-base) var(--ease-standard)}
  .zoom-layer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%;max-height:100%}
  .zoom-layer img{display:block;max-width:100%;max-height:calc(100vh - 96px);object-fit:contain;
    background:#fff;border-radius:10px;box-shadow:0 18px 48px rgba(2,6,23,.55)}
  .zoom-layer figcaption{font-size:13px;font-weight:600;color:#e2e8f4}
  .zoom-layer .zoom-hint{margin:0;font-size:12px;color:rgba(226,232,244,.7)}
  body.zoom-open{overflow:hidden}
  @keyframes zoomIn{from{opacity:0}to{opacity:1}}
  @media (max-width:1100px){.t81-tables{grid-template-columns:1fr}}
  .scroll{max-height:330px;overflow:auto;border:1px solid var(--border-soft);border-radius:11px}
  /* 分步标号 ①②③：让「位流 / 码树 / 码字清单」三层的阅读顺序一眼可见 */
  .step-mark{color:var(--blue);font-weight:700;margin-right:4px}
  .huff-saving{margin-left:14px;color:#64748b}
  .huff-saving b{color:#c2410c;font-size:13px}
  /* 演示台、表格、位流条都不画滚动条：超出时依旧能用滚轮/触摸/键盘滚，
     只是屏幕上不再出现一根灰条把画面切断 */
  .main,.scroll,.bits{scrollbar-width:none;-ms-overflow-style:none}
  .main::-webkit-scrollbar,.scroll::-webkit-scrollbar,.bits::-webkit-scrollbar{width:0;height:0}
  .bits{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;line-height:1.75;word-break:break-all;background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:10px;padding:9px;max-height:150px;overflow:auto}
  .bits .one{color:var(--blue);font-weight:700}
  .bits .zero{color:#8695aa}
  .bits .used{background:#fff1d6}
  .bits .cursor{color:#c2410c;font-weight:700}
  /* Huffman 页位流：一格一个符号，格内竖排「符号名 / 码字+幅值位」，
     每格自成一块，读者不用来回查表就知道这一小段比特属于谁 */
  /* 位流与上方的标准表之间留一点空隙，两段内容不贴在一起 */
  .stage>.bits.bitstream{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;margin-top:14px;max-height:none;word-break:normal}
  .bitstream .bitgroup{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
    margin:0;padding:5px 11px;min-width:64px;background:#f1f5fd;border:1px solid #e3eaf8;border-radius:7px;white-space:nowrap}
  .bitstream .bitgroup:hover{background:#e4ecfa;border-color:#c9d8f2}
  .bitstream .bitgroup>i{font-style:normal}
  .bitstream .groupname{font-style:normal;font-size:11.5px;line-height:1.25;color:#64748b}
  .bitstream .codebits{font-size:15px;font-weight:700;letter-spacing:.5px}
  .bitstream .ampbits{font-size:15px;font-weight:700;letter-spacing:.5px;background:#ffe6ab;border-radius:3px;padding:0 4px}
  /* 幅值位右边标出它对应的真实系数：011 = -4，读者不必自己按补码还原 */
  .bitstream .amprow{display:inline-flex;align-items:baseline;gap:6px}
  .bitstream .ampvalue{font-style:normal;font-family:Consolas,"Cascadia Mono",monospace;
    font-size:12px;font-weight:700;color:#5f6b7d;font-variant-numeric:tabular-nums}
  /* 唯一码字清单：一行 chips，统计并入同一行 */
  .huff-codes{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:10px}
  .huff-stat{font-size:12px;color:#64748b;margin-right:4px}
  .huff-code{display:inline-flex;align-items:baseline;gap:6px;padding:4px 9px;border:1px solid #e3eaf8;border-radius:7px;background:#fbfdff}
  .huff-code b{font-size:12px;color:#334155}
  .huff-code i{font-family:Consolas,monospace;font-style:normal;font-size:13px;font-weight:700;color:#1d4ed8}
  .huff-code em{font-style:normal;font-size:10.5px;color:#94a3b8}
  /* 编码后的数据：本块所有符号首尾相接的真实 0/1 串，蓝 = 码字、黄 = 幅值位 */
  .huff-stream{margin-top:12px;padding:9px 13px 10px;border:1px solid var(--border-soft);border-radius:11px;background:#fbfdff}
  .huff-stream-head{font-size:12.5px;color:#475569;margin-bottom:5px}
  .huff-stream-head b{color:var(--text);font-variant-numeric:tabular-nums}
  .huff-bitline{font-family:Consolas,"Cascadia Mono",monospace;font-size:14px;line-height:1.8;
    letter-spacing:.06em;color:#334155;word-break:break-all}
  .huff-bitline .c{color:#1d4ed8;font-weight:700}
  .huff-bitline .a{color:#b45309;font-weight:700;background:#fff6e2;border-radius:3px}
  .huff-bitline .partial{color:#64748b;background:#eef2f7;border-radius:3px;box-shadow:inset 0 0 0 1px #d3dde9}
  .huff-bitline .partial .c,.huff-bitline .partial .a{color:inherit;background:none}
  .huff-bitline .bytegap{display:inline-block;width:0;height:15px;margin:0 7px;
    vertical-align:-.16em;border-left:1px dashed #9aabc2}
  .huff-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 0;font-size:11.5px;color:var(--muted)}
  .huff-legend span{display:inline-flex;align-items:center;gap:5px}
  .huff-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:currentColor}
  .huff-legend .lg-c{color:#1d4ed8}
  .huff-legend .lg-a{color:#b45309}
  .huff-legend .lg-g{color:#94a3b8}
  .huff-legend .lg-g i{width:0;height:12px;border-left:1px dashed currentColor;border-radius:0;background:none}
  .huff-legend .lg-note{color:#8794a8}
  .huff-stream .note{margin-top:5px;font-size:12px}
  /* 熵解码页：三段式铺满演示台——顶部指标、中部码字格、底部位流片段。
     重复的进度条与汇总卡已移除；没有画布可缩，所以不走演示台默认的垂直居中。 */
  .stage.decode-view>:first-child{margin-top:0}
  .stage.decode-view>:last-child{margin-bottom:0}
  .decode-layout{display:flex;flex-direction:column;justify-content:space-between;gap:14px;width:100%;flex:1;min-height:0}
  .decode-stats,.decode-symbols,.decode-stream,#decodeReadout{width:100%}
  .decode-stats,.decode-symbols,.decode-stream{max-width:1360px;margin-left:auto;margin-right:auto}
  .decode-stats{margin-top:0}
  /* 逐符号读法：沿用 07.3 熵编码的码字格，静态展示整块解码结果 */
  .decode-symbols{margin-top:0;padding:12px 15px 13px;border:1px solid var(--border-soft);
    border-radius:12px;background:#fbfdff;box-shadow:var(--shadow-sm)}
  .decode-symbols-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .decode-symbols-head b{font-size:14px;color:var(--text)}
  .decode-symbols-head span{font-size:12px;color:var(--muted)}
  /* .stage>.bits.bitstream 那条只作用于直系节点，这里是卡片内的位流格，单独铺开 */
  .decode-symbols .bits{display:flex;flex-wrap:wrap;gap:10px;padding:9px 6px 5px;margin:0;
    max-height:none;word-break:normal;background:transparent;border:0}
  .decode-symbols .bitstream .bitgroup{min-width:80px;padding:7px 11px 6px;border-radius:9px;
    background:linear-gradient(180deg,#fff,#f5f8ff);box-shadow:var(--shadow-sm)}
  .decode-symbols .chip-head{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
  .decode-symbols .chip-no{font:700 10px/1 Consolas,"Cascadia Mono",monospace;color:#94a3b8}
  .decode-symbols .groupname{font-size:12px;color:#475569}
  .decode-symbols .codebits,.decode-symbols .ampbits{font-size:16px;letter-spacing:.7px}
  .decode-symbols .ampvalue{font-size:12.5px}
  .decode-symbols .bitgroup{transition:background-color var(--dur-fast) var(--ease-standard),
    border-color var(--dur-fast) var(--ease-standard),opacity var(--dur-fast) var(--ease-standard),
    transform var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
  .decode-symbols .bitgroup.done{background:#eef4ff;border-color:#cbdaf5}
  .decode-symbols .bitgroup.done .chip-no{color:#1d4ed8}
  .decode-symbols .bitgroup.active{background:#fff7ed;border-color:#fb923c;transform:translateY(-2px);
    box-shadow:0 0 0 2px rgba(251,146,60,.26),0 6px 14px rgba(194,65,12,.16)}
  .decode-symbols .bitgroup.active .chip-no{color:#c2410c}
  .decode-symbols .bitgroup.pending{opacity:.5;background:#fff;border-color:#e6edf6}
  .decode-legend .lg-tip{color:#8794a8}
  /* 位流片段贴底，和中部的码字格形成“从上到下”的解码动线；读数并入卡片做收口 */
  .decode-stream{max-width:1360px;margin:0 auto;padding:11px 15px 12px;
    border:1px solid var(--border-soft);border-radius:12px;background:#fbfdff;box-shadow:var(--shadow-sm)}
  #decodeReadout{max-width:none;margin:7px 0 0;font-size:12.5px;font-weight:600;color:#475569}
  .decode-stream-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .decode-stream-head b{font-size:14px;color:var(--text)}
  .decode-stream-head span{font-size:11.5px;color:var(--muted)}
  /* 位流已经在这张卡片里，里面的 .bits 不再重复画一层边框与底色 */
  .decode-stream .bits{border:0;background:transparent;padding:0;max-height:none;
    font-size:15px;line-height:2;letter-spacing:.1em}
  @media (max-width:700px){
    .decode-layout{justify-content:flex-start;gap:12px}
    .decode-stream{margin:0 auto}
  }
  .decode-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin:6px 0 0;
    font-size:11.5px;color:var(--muted)}
  .decode-legend span{display:inline-flex;align-items:center;gap:5px}
  .decode-legend i{font-style:normal;display:inline-block}
  .decode-legend .lg-used{width:14px;height:12px;border-radius:3px;background:#fff1d6;border:1px solid #f0dcb4}
  .decode-legend .lg-rest{width:14px;height:12px;border-radius:3px;background:#fff;border:1px solid #e2e8f0}
  .decode-legend .lg-cursor{color:#c2410c;font-size:14px;line-height:1;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{background:#eef3fb;border:1px solid #dbe6f5;border-radius:999px;padding:3px 9px;font-size:11.5px;color:#334155}
  .note{font-size:12.5px;line-height:1.7;color:#52627a;margin:8px 0 0}
  .subcap{font-size:12px;font-weight:600;color:#52627a;margin:0 0 6px}
  /* 位流写入动画会往这两个空块里填内容（三行符号信息 + 一行进度读数）；预留高度，
     免得动画一开就把整页顶高、跳出“一屏装下”。 */
  #huffCurrent{min-height:65px}
  #huffReadout{min-height:22px}
  /* 00 开篇：只有题板 + 两条原理标题，不放图与说明文字 */
  .opening{display:flex;flex-direction:column;gap:14px}
  .opening-hero{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding:11px 18px;border:1px solid #dbe6f7;border-radius:14px;background:linear-gradient(100deg,#eef4ff,#fbfdff)}
  .opening-hero-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .opening-hero-title b{font-size:30px;letter-spacing:.01em;color:#12203a}
  .opening-hero-title span{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.16em;background:#fff;border:1px solid #dbe6f7;border-radius:999px;padding:4px 12px}
  /* 开篇只留两条原理的标题：编号 + 大字，两条并排，不放正文与图片 */
  .opening-rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .opening-rule{display:flex;align-items:center;gap:20px;min-width:0;padding:26px 30px;border:1px solid var(--border-soft);border-radius:14px;background:#fff;box-shadow:var(--shadow-sm)}
  .opening-rule-no{font:700 44px/1 Consolas,monospace;color:var(--blue);letter-spacing:-.02em}
  .opening-rule h3{margin:0;font-size:32px;line-height:1.3;letter-spacing:.01em;color:var(--text)}
  .stage.compact .opening{gap:10px}
  .stage.compact .opening-hero{padding:10px 16px}
  .stage.compact .opening-hero-title b{font-size:24px}
  .stage.compact .opening-hero-title span{font-size:12px}
  .stage.compact .opening-rule{padding:18px 22px}
  .stage.compact .opening-rule-no{font-size:34px}
  .stage.compact .opening-rule h3{font-size:26px}
  .hvs-block{border:1px solid var(--border-soft);border-radius:14px;padding:16px;margin-bottom:16px;background:#fff;box-shadow:var(--shadow-sm)}
  .hvs-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px}
  .hvs-head span{font-weight:400;color:#52627a;font-size:12px;margin-left:0}
  .hvs-pager{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
  .hvs-pager button{border:1px solid var(--border-soft);background:#fff;border-radius:9px;padding:5px 11px;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .hvs-pager button:hover{border-color:#9db8f5;background:var(--blue-soft);color:var(--blue)}
  .hvs-pager button.on{background:var(--blue-soft);border-color:#9db8f5;color:var(--blue);font-weight:600}
  .hvs-page[hidden]{display:none}
  .hvs-page .hvs-hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
  figure.hvs-solid{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%}
  figure.hvs-solid canvas{margin:0 auto;max-width:100%}
  figure.hvs-solid figcaption{margin-top:8px}
  .hvs-luma-pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--hvs-gap,14px);align-items:start}
  .hvs-luma-pair{display:flex;flex-direction:column;gap:10px;min-width:0}
  .hvs-luma-pair figure{display:flex;flex-direction:column;align-items:center;min-width:0;width:100%}
  .hvs-luma-pair canvas{max-width:100%;margin:0 auto}
  .hvs-luma-pair figcaption{text-align:center;line-height:1.5}
  .hvs-luma-pair + .hvs-luma-pair{border-left:1px dashed #e2e8f0;padding-left:var(--hvs-gap,14px)}
  .hvs-luma-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--hvs-gap,14px);align-items:start}
  .hvs-luma-grid figure{display:flex;flex-direction:column;align-items:center;min-width:0}
  .hvs-luma-grid figure:first-child{grid-column:1/-1}
  .hvs-luma-grid figcaption{text-align:center;line-height:1.5}
  /* 横向够宽就三图并排：一行装下对比图，1366×768 这类笔记本一屏也能看全 */
  @media (min-width:960px){
    .hvs-luma-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .hvs-luma-grid figure:first-child{grid-column:auto}
  }
  @media (max-width:700px){
    .hvs-luma-grid{grid-template-columns:minmax(0,1fr)}
    .hvs-luma-grid figure:first-child{grid-column:auto}
  }
  .hvs-sliders{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  /* 顶部标题行右侧放自动演示控件 */
  .hvs-head .hvs-sliders{margin:0 0 0 auto}
  .hvs-auto-group{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:999px;padding:5px 13px}
  .hvs-auto-group b{color:var(--text);font-weight:700;font-size:12.5px}
  .hvs-auto-group output{font-family:Consolas,monospace;font-size:12.5px;font-weight:700;color:var(--blue);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
  .hvs-conclusion{border-left:3px solid var(--blue);background:var(--blue-soft);color:#1e3a8a;padding:10px 14px;border-radius:0 9px 9px 0;font-size:13px;line-height:1.6;margin-top:14px}
  .hvs-block figcaption{text-align:center;line-height:1.5}
  .ok{color:var(--green);font-weight:600}
  .warn{color:var(--orange);font-weight:600}
  .error{color:var(--red);font-weight:600}
  /* 主界面不画滚动条（原来这里画 8px 灰条）：内容超出时滚轮/触摸/键盘照常能滚。
     必须放在文件靠后的位置，否则会被上面的 width 规则重新盖回可见。 */
  .main::-webkit-scrollbar,.scroll::-webkit-scrollbar,.stepper::-webkit-scrollbar,.bits::-webkit-scrollbar{width:0;height:0}

  /* ---------- 大屏（≥1560px，含 27" 2560×1440）：演示台独占整屏，说明面板留到第二屏 ---------- */

      --main-col-max:min(100%,2560px)}

    .source-layout{grid-template-columns:minmax(0,1fr) clamp(320px,18vw,460px)}

  /* 矮屏（1366×768、1280×720 投影）：两幅对比图收一档，整块不用滚动也能看完 */
